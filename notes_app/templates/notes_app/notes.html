{% extends 'notes_app/base.html' %}
{% block content %}
<h2>Notes for {{ user.username }}</h2>
<a href="/notes/add/">Add Note</a> | 
<a href="/search/">Search</a> | 
<a href="/logout/">Logout</a>
<ul>
{% for note in notes %}
    <li><a href="/notes/{{ note.id }}/">{{ note.title }}</a></li>
{% endfor %}
</ul>
{% endblock %}
